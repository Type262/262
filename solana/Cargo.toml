[workspace]
members = ["programs/*"]
# Separate workspaces: the LiteSVM tests run on newer Solana crates than the on-chain build,
# and must not move the versions in this Cargo.lock. bench/ belongs to the benchmarks.
exclude = ["tests-rs", "bench"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
