# Render blueprint for TYPE/262. Solana is the main network; Robinhood Chain is also supported.
# type262: the static landing page, app, docs, board and domain profiles.
# type262-upload: the Solana vault worker (/solana/*). Every domain's vault key is derived from VAULT_MASTER_SEED, so
# this service holds the keys of the Solana vaults and pays a vault out to the SOL wallet the domain publishes in
# DNSSEC-signed DNS. Its gas wallet pays the fees. It also pins Launch-form images and coin metadata to IPFS through
# Pinata, and serves the Solana /rpc/solana relay and the read-only Robinhood Chain /rpc fallback, so the Pinata key
# and any RPC key never reach the browser. On Robinhood Chain no server is in the claim path: the contracts check
# DNSSEC proofs on-chain. See DEPLOY.md.
services:
  - type: web
    name: type262
    runtime: static
    buildCommand: sh scripts/build.sh
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes: # clean URLs for the Unclaimed Board and domain profiles
      - type: rewrite
        source: /board
        destination: /board.html
      - type: rewrite
        source: /d/*
        destination: /domain.html

  - type: web
    name: type262-upload
    runtime: node
    plan: free
    buildCommand: echo "no build step (zero dependencies)"
    startCommand: node upload/server.mjs
    healthCheckPath: /health
    envVars:
      - key: PINATA_JWT # Pinata API key (JWT) allowed to upload files. Set it in the Render dashboard; never commit it.
        sync: false
      - key: ALLOW_ORIGINS
        value: https://type262.onrender.com
      - key: ROBINHOOD_RPC_URL # optional keyed Robinhood Chain RPC for /rpc, tried before the public one; never commit it
        sync: false
      - key: SOLANA_RPC_URL # keyed Solana RPC for /rpc/solana and the vault worker, tried before the public nodes; it must allow getProgramAccounts (pump.fun coins); never commit it
        sync: false
      - key: VAULT_MASTER_SEED # 64 hex characters: the master secret of every Solana vault and the gas wallet. Set it once in the dashboard, back it up offline; never commit it
        sync: false
      - key: SOLANA_GAS_KEYPAIR # optional: a Solana CLI keypair JSON for the gas wallet when it is funded directly instead of derived; never commit it
        sync: false
      - key: SOLANA_FEE_WALLET # Solana address that receives the claim fee
        sync: false
      - key: FEE_BPS # claim fee in basis points, taken from every asset a claim pays out (50 = 0.5%)
        value: "50"
      - key: REFUND_DELAY_DAYS # how long a deposit waits before its sender can take it back, if the domain has not claimed it
        value: "180"
