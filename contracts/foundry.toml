[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@ensdomains/buffer/=lib/buffer/",
  "@ensdomains/solsha1/=lib/solsha1/",
  "@openzeppelin/contracts-v5/=lib/openzeppelin-contracts/contracts/",
  "@ens/=lib/ens-contracts/contracts/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
