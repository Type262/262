<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866" role="img" aria-labelledby="t d">
<title id="t">TYPE/262 on Robinhood Chain</title>
<desc id="d">Robinhood Chain (chain id 4663), the second network TYPE/262 supports alongside Solana. Clients (web app, SDK lib/wallet262.js, CLI, MCP server for AI agents) resolve domains over DNS-over-HTTPS from Cloudflare and Google, reading the WALLET record or _wallet TXT in a DNSSEC-signed zone, and settle on Robinhood Chain: DomainEscrow asks DnssecVerifier, which uses the ENS DNSSECImpl oracle anchored to the IANA root keys. DomainLauncher launches tokens on pons v2 whose creator fees reach DomainEscrow through DomainFeeForwarder. Assets are USDG and ETH.</desc>
