<rect x="48" y="508" width="556" height="144" rx="16" fill="url(#pg)" stroke="#3a2f5c"/>
<text x="76" y="542" font-size="11.5" fill="#B7A0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">SIDE PATH · REFUND</text>
<text x="76" y="572" font-size="17" fill="#EDEDED" font-weight="600">Unclaimed? The sender takes it back.</text>
