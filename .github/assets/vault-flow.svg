<text x="743" y="364" font-size="13.5" fill="#8F8F8F">Cloudflare and Google</text>
<text x="743" y="384" font-size="13.5" fill="#8F8F8F">agree, both DNSSEC-</text>
<text x="743" y="404" font-size="13.5" fill="#8F8F8F">validated (AD): one SOL</text>
<text x="743" y="424" font-size="13.5" fill="#8F8F8F">address, a regular wallet.</text>
<circle cx="937.5" cy="168" r="3" fill="#C8FF1E"/><circle cx="937.5" cy="168" r="1.35" fill="#F7FFE0"/>
<rect x="948" y="204" width="204" height="252" rx="16" fill="url(#pg)" stroke="#3b4a14"/>
