<text x="375" y="172.5" font-size="12.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" text-anchor="middle">02</text>
<text x="293" y="238" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">WAIT</text>
<text x="293" y="268" font-size="18" fill="#EDEDED" font-weight="600">Money waits</text>
<text x="293" y="296" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">in the vault,</text>
<text x="293" y="314" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">public on Solana</text>
<text x="293" y="364" font-size="13.5" fill="#8F8F8F">The domain's pump.fun</text>
<text x="293" y="384" font-size="13.5" fill="#8F8F8F">creator fees are</text>
<text x="293" y="404" font-size="13.5" fill="#8F8F8F">collected here too.</text>
<circle cx="487.5" cy="168" r="3" fill="#C8FF1E"/><circle cx="487.5" cy="168" r="1.35" fill="#F7FFE0"/>
