<text x="518" y="314" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  &quot;SOL &lt;address&gt;&quot;</text>
<text x="518" y="332" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">or WALLET (262)</text>
<text x="518" y="364" font-size="13.5" fill="#8F8F8F">A DNSSEC-signed</text>
<text x="518" y="384" font-size="13.5" fill="#8F8F8F">record with one</text>
<text x="518" y="404" font-size="13.5" fill="#8F8F8F">Solana address.</text>
<circle cx="712.5" cy="168" r="3" fill="#C8FF1E"/><circle cx="712.5" cy="168" r="1.35" fill="#F7FFE0"/>
