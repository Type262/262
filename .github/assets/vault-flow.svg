<text x="76" y="622" font-size="13.5" fill="#8F8F8F"><tspan >if no claim came since · memo </tspan><tspan fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">type262:refund:&lt;signature&gt;</tspan></text>
<rect x="628" y="508" width="524" height="144" rx="16" fill="url(#pg)" stroke="#262626"/>
<text x="656" y="542" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">THE WORKER'S RULES</text>
<text x="656" y="572" font-size="17" fill="#EDEDED" font-weight="600">Signed DNS alone names the payee.</text>
<text x="656" y="600" font-size="13.5" fill="#8F8F8F"><tspan fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FEE_BPS 50</tspan><tspan > (0.5%) and </tspan><tspan fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REFUND_DELAY_DAYS 180</tspan></text>
<text x="656" y="622" font-size="13.5" fill="#8F8F8F">No database: every check reads the chain.</text>
