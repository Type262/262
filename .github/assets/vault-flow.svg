<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="684" viewBox="0 0 1200 684" role="img" aria-labelledby="t d">
<title id="t">TYPE/262 Solana vault flow</title>
<desc id="d">Solana, one vault per domain. Send: anyone sends SOL, USDC or any SPL token to vault(domain), the domain's own Solana address, with a plain transfer. Wait: it sits in the vault, public on Solana; the domain's pump.fun creator fees are collected there too. Publish: the owner publishes a DNSSEC-signed _wallet TXT &quot;SOL &lt;address&gt;&quot; or WALLET (type 262) record with one Solana address. Check: anyone calls POST /solana/claim; the worker requires Cloudflare and Google to agree on exactly one SOL address, both DNSSEC-validated (AD bit), and that address to be a regular wallet. Paid: everything in the vault goes to the published wallet minus a 0.5% fee, with the memo type262:claim:&lt;domain&gt;; the worker pays the network fees. If nobody claims, POST /solana/refund returns a deposit to its sender 180 days after it was sent, if the domain has not claimed since, with the memo type262:refund:&lt;signature&gt;. FEE_BPS 50 and REFUND_DELAY_DAYS 180; no database, every check reads the chain.</desc>
<defs>
