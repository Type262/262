<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">TYPE/262 escrow flow</title>
<desc id="d">Send: anyone deposits USDG or ETH with deposit or depositToken into a pool keyed by the domain. Wait: the money sits on-chain, in public. Publish: the owner adds a DNSSEC-signed WALLET or _wallet TXT record with an EVM address. Prove: claim(domain, wallet, proof, tokens), DnssecVerifier checks the signature chain on-chain up to the DNS root keys. Paid: each listed pool goes to the published wallet minus a 0.5% fee. If nobody claims, each sender can refund their deposit 180 days after their last deposit.</desc>
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141414"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
<radialGradient id="ga" gradientUnits="userSpaceOnUse" cx="120" cy="0" r="620"><stop offset="0" stop-color="#C8FF1E" stop-opacity=".09"/><stop offset="1" stop-color="#C8FF1E" stop-opacity="0"/></radialGradient>
<radialGradient id="gv" gradientUnits="userSpaceOnUse" cx="1140" cy="640" r="640"><stop offset="0" stop-color="#8B5CFF" stop-opacity=".12"/><stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#C8FF1E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#B7A0FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#7A7A7A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="640" rx="20" fill="#0a0a0a"/>
<rect width="1200" height="640" rx="20" fill="url(#ga)"/>
<rect width="1200" height="640" rx="20" fill="url(#gv)"/>
<rect x=".5" y=".5" width="1199" height="639" rx="19.5" fill="none" stroke="#262626"/>
<g font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<rect x="48" y="53" width="8" height="8" fill="#C8FF1E"/><text x="66" y="62" font-size="12" fill="#8F8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2.4">ESCROW</text><text x="48" y="104" font-size="30" fill="#EDEDED" font-weight="700"><tspan >Pay a domain </tspan><tspan fill="#C8FF1E">before</tspan><tspan > it publishes a wallet.</tspan></text><text x="1152" y="62" font-size="11.5" fill="#8F8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="1.2">DomainEscrow · 0x9fd2…E8d5</text>
<linearGradient id="tk" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="1176" y2="0"><stop offset="0" stop-color="#C8FF1E" stop-opacity=".15"/><stop offset=".5" stop-color="#C8FF1E" stop-opacity=".55"/><stop offset="1" stop-color="#C8FF1E" stop-opacity=".9"/></linearGradient>
<line x1="24" y1="168" x2="1176" y2="168" stroke="url(#tk)" stroke-width="1.2"/>
<path d="M24 168 C 300 122, 900 122, 1176 168" fill="none" stroke="#C8FF1E" stroke-opacity=".1"/>
<rect x="48" y="204" width="204" height="232" rx="16" fill="url(#pg)" stroke="#262626"/>
<line x1="150.0" y1="184" x2="150.0" y2="204" stroke="#C8FF1E" stroke-opacity=".45"/>
<circle cx="150.0" cy="168" r="16" fill="#0a0a0a" stroke="#C8FF1E" stroke-opacity=".85"/>
<text x="150" y="172.5" font-size="12.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" text-anchor="middle">01</text>
<text x="68" y="238" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">SEND</text>
<text x="68" y="268" font-size="18" fill="#EDEDED" font-weight="600">Anyone pays</text>
<text x="68" y="296" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">deposit</text>
<text x="68" y="314" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">depositToken</text>
<text x="68" y="364" font-size="13.5" fill="#8F8F8F">USDG or ETH joins a</text>
<text x="68" y="384" font-size="13.5" fill="#8F8F8F">pool keyed by the</text>
<text x="68" y="404" font-size="13.5" fill="#8F8F8F">domain name.</text>
<circle cx="262.5" cy="168" r="3" fill="#C8FF1E"/><circle cx="262.5" cy="168" r="1.35" fill="#F7FFE0"/>
<rect x="273" y="204" width="204" height="232" rx="16" fill="url(#pg)" stroke="#262626"/>
<line x1="375.0" y1="184" x2="375.0" y2="204" stroke="#C8FF1E" stroke-opacity=".45"/>
<circle cx="375.0" cy="168" r="16" fill="#0a0a0a" stroke="#C8FF1E" stroke-opacity=".85"/>
<text x="375" y="172.5" font-size="12.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" text-anchor="middle">02</text>
<text x="293" y="238" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">WAIT</text>
<text x="293" y="268" font-size="18" fill="#EDEDED" font-weight="600">Money waits</text>
<text x="293" y="296" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">on-chain</text>
<text x="293" y="314" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">in public</text>
<text x="293" y="364" font-size="13.5" fill="#8F8F8F">Visible to anyone on</text>
<text x="293" y="384" font-size="13.5" fill="#8F8F8F">Robinhood Chain and</text>
<text x="293" y="404" font-size="13.5" fill="#8F8F8F">the Unclaimed Board.</text>
<circle cx="487.5" cy="168" r="3" fill="#C8FF1E"/><circle cx="487.5" cy="168" r="1.35" fill="#F7FFE0"/>
<rect x="498" y="204" width="204" height="232" rx="16" fill="url(#pg)" stroke="#262626"/>
<line x1="600.0" y1="184" x2="600.0" y2="204" stroke="#C8FF1E" stroke-opacity=".45"/>
<circle cx="600.0" cy="168" r="16" fill="#0a0a0a" stroke="#C8FF1E" stroke-opacity=".85"/>
<text x="600" y="172.5" font-size="12.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" text-anchor="middle">03</text>
<text x="518" y="238" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">PUBLISH</text>
<text x="518" y="268" font-size="18" fill="#EDEDED" font-weight="600">Owner publishes</text>
<text x="518" y="296" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">_wallet TXT</text>
<text x="518" y="314" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">or WALLET (262)</text>
<text x="518" y="364" font-size="13.5" fill="#8F8F8F">A DNSSEC-signed</text>
<text x="518" y="384" font-size="13.5" fill="#8F8F8F">record with an EVM</text>
<text x="518" y="404" font-size="13.5" fill="#8F8F8F">address.</text>
<circle cx="712.5" cy="168" r="3" fill="#C8FF1E"/><circle cx="712.5" cy="168" r="1.35" fill="#F7FFE0"/>
<rect x="723" y="204" width="204" height="232" rx="16" fill="url(#pg)" stroke="#262626"/>
<line x1="825.0" y1="184" x2="825.0" y2="204" stroke="#C8FF1E" stroke-opacity=".45"/>
<circle cx="825.0" cy="168" r="16" fill="#0a0a0a" stroke="#C8FF1E" stroke-opacity=".85"/>
<text x="825" y="172.5" font-size="12.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" text-anchor="middle">04</text>
<text x="743" y="238" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">PROVE</text>
<text x="743" y="268" font-size="18" fill="#EDEDED" font-weight="600">Proof on-chain</text>
<text x="743" y="296" font-size="12" fill="#B7A0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">claim(domain,</text>
<text x="743" y="314" font-size="12" fill="#B7A0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  wallet, proof,</text>
<text x="743" y="332" font-size="12" fill="#B7A0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  tokens)</text>
<text x="743" y="364" font-size="13.5" fill="#8F8F8F">DnssecVerifier checks</text>
<text x="743" y="384" font-size="13.5" fill="#8F8F8F">every signature up to</text>
<text x="743" y="404" font-size="13.5" fill="#8F8F8F">the DNS root keys.</text>
<circle cx="937.5" cy="168" r="3" fill="#C8FF1E"/><circle cx="937.5" cy="168" r="1.35" fill="#F7FFE0"/>
<rect x="948" y="204" width="204" height="232" rx="16" fill="url(#pg)" stroke="#3b4a14"/>
<line x1="1050.0" y1="184" x2="1050.0" y2="204" stroke="#C8FF1E" stroke-opacity=".45"/>
<circle cx="1050.0" cy="168" r="26" fill="#C8FF1E" opacity=".16" filter="url(#blur)"/>
<circle cx="1050.0" cy="168" r="16" fill="#C8FF1E"/>
<text x="1050" y="172.5" font-size="12.5" fill="#0a0a0a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">05</text>
<text x="968" y="238" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">PAID</text>
<text x="968" y="268" font-size="18" fill="#EDEDED" font-weight="600">Wallet is paid</text>
<text x="968" y="296" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">→ published wallet</text>
<text x="968" y="314" font-size="12" fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">− 0.5% fee</text>
<text x="968" y="364" font-size="13.5" fill="#8F8F8F">Each listed pool, in one</text>
<text x="968" y="384" font-size="13.5" fill="#8F8F8F">transaction. The wallet</text>
<text x="968" y="404" font-size="13.5" fill="#8F8F8F">needs no gas.</text>
<path d="M375.0 436 V458 Q375.0 472 361.0 472 H120 Q106 472 106 485" fill="none" stroke="#B7A0FF" stroke-opacity=".7" stroke-dasharray="4 5" marker-end="url(#av)"/>
<rect x="48" y="488" width="556" height="120" rx="16" fill="url(#pg)" stroke="#3a2f5c"/>
<text x="76" y="522" font-size="11.5" fill="#B7A0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">SIDE PATH · REFUND</text>
<text x="76" y="552" font-size="17" fill="#EDEDED" font-weight="600">Unclaimed? The sender takes it back.</text>
<text x="76" y="580" font-size="13.5" fill="#8F8F8F"><tspan fill="#B7A0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">refund(domain, token)</tspan><tspan >  180 days after their last deposit</tspan></text>
<rect x="628" y="488" width="524" height="120" rx="16" fill="url(#pg)" stroke="#262626"/>
<text x="656" y="522" font-size="11.5" fill="#C8FF1E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">FIXED IN THE CONTRACT</text>
<text x="656" y="552" font-size="17" fill="#EDEDED" font-weight="600">No server, attestor or admin picks the payee.</text>
<text x="656" y="580" font-size="13.5" fill="#8F8F8F"><tspan fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">feeBps 50</tspan><tspan > (0.5%) and </tspan><tspan fill="#CFCFCF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">refundDelay</tspan><tspan > are immutable</tspan></text>
</g>
