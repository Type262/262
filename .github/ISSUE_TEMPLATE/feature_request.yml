name: Feature request
description: Suggest an improvement or a new capability for TYPE/262.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Start with the problem you want solved; the best design often comes out of the discussion.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of TYPE/262 would this change?
      options:
        - App (app.html)
        - Landing page (index.html)
        - Docs
        - SDK (lib/wallet262.js)
        - CLI (bin/type262.mjs)
        - Upload service
        - Contracts
        - WALLET record support in other software
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When my agent pays an x402 endpoint, I want to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. API sketches, commands or screenshots help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, related specs (RFCs, EIPs, x402), or anything else that helps.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I would like to open a pull request for this.
